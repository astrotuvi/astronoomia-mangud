<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- the pages are dark already: keeps phone browsers from recolouring them in dark mode -->
  <meta name="color-scheme" content="dark">
  <title>Tähest täheni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <!-- Menu -->
  <main id="menu" class="screen menu">
    <div class="menu-inner">
      <header class="menu-head">
        <a class="icon" href="../index.html" data-t-label="allGames" aria-label="Kõik mängud">🏠</a>
        <!-- Suur Vanker, as on a sky chart, from the stars' positions -->
        <h1><span class="logo"><svg class="dipper-logo" viewBox="0 0 24 24" aria-hidden="true" data-ink>
          <circle cx="12" cy="12" r="12" fill="#1b2766" />
          <path d="M18.8 8.2L20 11.5L15.6 14.1L13.5 12.1L10.1 12.7L7.3 12.9L4 15.8M13.5 12.1L18.8 8.2" fill="none" stroke="#a8bcff" stroke-opacity="0.8" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="18.8" cy="8.2" r="1.3" fill="#ffd34d" />
          <circle cx="20" cy="11.5" r="1.1" fill="#ffd34d" />
          <circle cx="15.6" cy="14.1" r="1.1" fill="#ffd34d" />
          <circle cx="13.5" cy="12.1" r="0.8" fill="#ffd34d" />
          <circle cx="10.1" cy="12.7" r="1.3" fill="#ffd34d" />
          <circle cx="7.3" cy="12.9" r="1.15" fill="#ffd34d" />
          <circle cx="4" cy="15.8" r="1.25" fill="#ffd34d" />
        </svg></span> <span data-t="title"></span></h1>
        <div class="lang">
          <button data-lang="et">EST</button>
          <button data-lang="en">ENG</button>
        </div>
      </header>

      <p class="intro" data-t="intro1"></p>
      <p class="intro" data-t="intro2"></p>

      <h2 data-t="chooseLevel"></h2>
      <div id="levels" class="levels"></div>

      <div class="play-row">
        <button id="playBtn" class="play">▶ <span data-t="play"></span></button>
      </div>

      <footer class="credit">
        <div data-t="credit"></div>
        <div data-t="author"></div>
      </footer>
    </div>
  </main>

  <!-- Game: the sky, with the task at the top -->
  <div id="game" class="screen game hidden">
    <div class="bar">
      <button id="homeBtn" class="icon" data-t-label="menu" aria-label="Menüü">⬅️</button>
      <div class="progress">
        <div class="track"><div id="fill" class="fill"></div></div>
        <div id="count" class="progress-text"></div>
      </div>
      <button id="hintBtn" class="icon" data-t-label="hint" aria-label="Vihje">💡</button>
      <button id="soundBtn" class="icon toggle" data-t-label="sound" aria-label="Heli">🔊</button>
    </div>
    <div id="area" class="area">
      <canvas id="sky"></canvas>
      <div id="task" class="task">
        <small id="when"></small>
        <b id="taskName"></b>
        <p id="taskText"></p>
        <p id="tip" class="tip"></p>
        <a id="photoCredit" class="photo-credit hidden" target="_blank" rel="noopener"></a>
        <button id="nextBtn" class="btn hidden"></button>
      </div>
      <span id="finger" class="finger hidden">👆</span>
      <!-- the player's own date, and the hour from 18:00 to 06:00 -->
      <div id="explore" class="sky-slider explore hidden">
        <label><span data-t="day"></span><input id="dayRange" type="range" min="0" max="364" step="1" value="287"></label>
        <label><span data-t="hour"></span><input id="hourRange" type="range" min="0" max="720" step="1" value="180"></label>
        <button id="exploreDone" class="btn"></button>
      </div>
      <!-- how bright the sky is, smoothly from bright to dark: the lights
           round, the Moon and the twilight -->
      <div id="slider" class="sky-slider hidden">
        <input id="skyRange" type="range" min="0" max="100" step="1" value="0" data-t-label="skyLabel" aria-label="Taeva heledus">
        <div class="sky-labels"><span data-t="skyBright"></span><span data-t="skyDark"></span></div>
        <button id="sliderDone" class="btn"></button>
      </div>
    </div>
  </div>

  <!-- Win overlay: the map of all the hops -->
  <div id="win" class="overlay hidden">
    <canvas id="confetti"></canvas>
    <div class="win-pic">
      <img id="winImg" alt="">
      <button id="mapBtn" class="icon map-btn" data-t-label="bigMap" aria-label="Suurem kaart">🔍</button>
    </div>
    <div class="win-card">
      <h2><span data-t="wellDone"></span> 🎉</h2>
      <p id="winName" class="win-name"></p>
      <p id="winFact" class="win-fact"></p>
      <div class="win-buttons">
        <button id="againBtn" class="btn">🔁 <span data-t="again"></span></button>
        <button id="nextLevelBtn" class="btn">▶ <span data-t="nextLevel"></span></button>
        <button id="menuBtn" class="btn alt">⬅️ <span data-t="menu"></span></button>
      </div>
    </div>
  </div>

  <!-- the map over the whole screen, to make bigger and scroll round -->
  <div id="mapBox" class="overlay map-box hidden">
    <div id="mapScroll" class="map-scroll"><img id="mapBoxImg" alt=""></div>
    <div class="map-buttons">
      <button id="mapZoomBtn" class="icon">➕</button>
      <button id="mapClose" class="icon" data-t-label="close" aria-label="Sulge">✕</button>
    </div>
  </div>

  <!-- a photo from the map, over it -->
  <div id="photoBox" class="overlay photo-box hidden">
    <img id="photoBoxImg" alt="">
    <p id="photoBoxName" class="win-name"></p>
    <a id="photoBoxCredit" class="win-credit" target="_blank" rel="noopener"></a>
  </div>

  <script src="../shared/common.js"></script>
  <script src="stars.js"></script>
  <script src="app.js"></script>
</body>
</html>
