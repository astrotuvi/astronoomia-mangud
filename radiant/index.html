<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- the pages are dark already: keeps phone browsers from recolouring them in dark mode -->
  <meta name="color-scheme" content="dark">
  <title>Uuri meteoore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <!-- Menu: pick a level -->
  <main id="menu" class="screen menu">
    <div class="menu-inner">
      <header class="menu-head">
        <a class="icon" href="../index.html" data-t-label="allGames" aria-label="Kõik mängud">🏠</a>
        <h1><span class="logo">🔍</span> <span data-t="title"></span></h1>
        <div class="lang">
          <button data-lang="et">EST</button>
          <button data-lang="en">ENG</button>
        </div>
      </header>

      <p class="intro" data-t="intro1"></p>
      <p class="intro" data-t="intro2"></p>

      <h2 data-t="chooseLevel"></h2>
      <div id="levels" class="levels"></div>

      <div class="play-row">
        <button id="playBtn" class="play">▶ <span data-t="play"></span></button>
      </div>

      <footer class="credit">
        <div data-t="author"></div>
      </footer>
    </div>
  </main>

  <!-- Game: the photo of the sky with the trails, and the question -->
  <div id="game" class="screen game hidden">
    <div class="bar">
      <button id="homeBtn" class="icon" data-t-label="menu" aria-label="Menüü">⬅️</button>
      <div class="progress">
        <div class="track"><div id="progressFill" class="fill"></div></div>
        <div id="progressText" class="progress-text"></div>
      </div>
      <button id="hintBtn" class="icon" data-t-label="hint" aria-label="Vihje">💡</button>
      <button id="soundBtn" class="icon toggle" data-t-label="sound" aria-label="Heli">🔊</button>
    </div>
    <div id="area" class="area">
      <canvas id="sky"></canvas>
      <div id="tap" class="tap hidden">👆</div>
      <div id="caption" class="caption hidden"><b id="capTitle"></b><small id="capText"></small></div>
      <div id="ask" class="ask hidden">
        <p id="askTitle" class="ask-title"></p>
        <p id="askText" class="ask-text"></p>
        <div id="options" class="options"></div>
        <div class="next-row"><button id="nextBtn" class="btn hidden"></button></div>
      </div>
    </div>
  </div>

  <!-- Win overlay: the sky with the radiants found -->
  <div id="win" class="overlay hidden">
    <canvas id="confetti"></canvas>
    <div class="win-pic"><canvas id="winSky"></canvas></div>
    <div class="win-card">
      <h2><span data-t="winTitle"></span> 🔍</h2>
      <p id="winName" class="win-name"></p>
      <p id="winFact" class="win-fact"></p>
      <div class="win-buttons">
        <button id="nextLevelBtn" class="btn">▶ <span data-t="nextLevel"></span></button>
        <button id="againBtn" class="btn">🔁 <span data-t="again"></span></button>
        <button id="menuBtn" class="btn alt">⬅️ <span data-t="menu"></span></button>
      </div>
    </div>
  </div>

  <script src="../shared/common.js"></script>
  <script src="app.js"></script>
</body>
</html>
