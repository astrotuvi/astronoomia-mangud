<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- the pages are dark already: keeps phone browsers from recolouring them in dark mode -->
  <meta name="color-scheme" content="dark">
  <title>Kosmoselabürint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <!-- Menu -->
  <main id="menu" class="screen menu">
    <div class="menu-inner">
      <header class="menu-head">
        <a class="icon" href="../index.html" data-t-label="allGames" aria-label="Kõik mängud">🏠</a>
        <!-- there is no maze emoji: a small maze with the way through it -->
        <h1><span class="logo"><svg class="maze-logo" viewBox="0 0 24 24" aria-hidden="true" data-ink>
          <rect width="24" height="24" rx="5" fill="#1b2766" />
          <path d="M4.5 0V4.5H19.5V9.5H4.5V14.5H19.5V19.5H4.5V24" fill="none" stroke="#ffd34d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M7 2H22V22H7M2 2V22M2 7H17M7 12H22M2 17H17" fill="none" stroke="#5fd4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg></span> <span data-t="title"></span></h1>
        <div class="lang">
          <button data-lang="et">EST</button>
          <button data-lang="en">ENG</button>
        </div>
      </header>

      <p class="intro" data-t="intro1"></p>
      <p class="intro" data-t="intro2"></p>

      <h2 data-t="chooseLevel"></h2>
      <div id="levels" class="levels"></div>

      <div class="play-row">
        <button id="playBtn" class="play">▶ <span data-t="play"></span></button>
      </div>

      <footer class="credit">
        <a href="https://app.astrobin.com/u/Astronoomiaklubi" target="_blank" rel="noopener" data-t="credit"></a>
        <div data-t="author"></div>
      </footer>
    </div>
  </main>

  <!-- Game: the picture to find, and the maze with the pictures at its sides -->
  <div id="game" class="screen game hidden">
    <div class="bar">
      <button id="homeBtn" class="icon" data-t-label="menu" aria-label="Menüü">⬅️</button>
      <div class="progress">
        <div id="levelName" class="progress-text"></div>
      </div>
      <button id="hintBtn" class="icon" data-t-label="hint" aria-label="Vihje">💡</button>
      <button id="soundBtn" class="icon toggle" data-t-label="sound" aria-label="Heli">🔊</button>
    </div>
    <div id="area" class="area">
      <div id="task" class="task">
        <small id="taskText"></small>
        <b id="targetName"></b>
        <img id="targetImg" class="hidden" alt="">
      </div>
      <div id="field" class="field">
        <canvas id="maze"></canvas>
        <img id="photoA" class="photo" alt="">
        <img id="photoB" class="photo" alt="">
        <img id="photoC" class="photo hidden" alt="">
        <span id="rocket" class="rocket">🚀</span>
        <span id="finger" class="finger hidden">👆</span>
      </div>
    </div>
  </div>

  <!-- What a wrong picture shows, when the rocket gets to it -->
  <div id="fact" class="fact hidden">
    <div class="fact-card">
      <img id="factImg" alt="">
      <h3 id="factName"></h3>
      <p id="factText"></p>
      <p id="factNote" class="fact-note"></p>
      <button id="backBtn" class="btn" data-t="back"></button>
    </div>
  </div>

  <!-- Win overlay: the right picture and what it shows -->
  <div id="win" class="overlay hidden">
    <canvas id="confetti"></canvas>
    <div class="win-pic"><img id="winImg" alt=""></div>
    <div class="win-card">
      <h2><span data-t="wellDone"></span> 🎉</h2>
      <p id="winName" class="win-name"></p>
      <p id="winFact" class="win-fact"></p>
      <a id="winCredit" class="win-credit" target="_blank" rel="noopener"></a>
      <div class="win-buttons">
        <button id="againBtn" class="btn">🔁 <span data-t="newMaze"></span></button>
        <button id="nextLevelBtn" class="btn">▶ <span data-t="nextLevel"></span></button>
        <button id="menuBtn" class="btn alt">⬅️ <span data-t="menu"></span></button>
      </div>
    </div>
  </div>

  <script src="../shared/common.js"></script>
  <script src="app.js"></script>
</body>
</html>
