<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- the pages are dark already: keeps phone browsers from recolouring them in dark mode -->
  <meta name="color-scheme" content="dark">
  <title>Kuu faasid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <!-- Game: the goals, the view from space and the view from the Earth -->
  <div id="game" class="screen game">
    <div class="bar">
      <a class="icon" href="../index.html" data-t-label="allGames" aria-label="Kõik mängud">🏠</a>
      <div id="goals" class="goals"></div>
      <button id="runBtn" class="icon" data-t-label="run" aria-label="Käivita">▶️</button>
      <button id="hintBtn" class="icon" data-t-label="hint" aria-label="Vihje">👁️</button>
      <button id="soundBtn" class="icon toggle" data-t-label="sound" aria-label="Heli">🔊</button>
      <div class="lang">
        <button data-lang="et">EST</button>
        <button data-lang="en">ENG</button>
      </div>
    </div>
    <div id="area" class="area">
      <div class="panels">
        <div class="panel space">
          <svg id="space" viewBox="-110 -110 220 220"></svg>
          <div class="panel-title" data-t="fromSpace"></div>
          <div id="season" class="season hidden" data-t="season"></div>
          <div class="sun-label" data-t="sun"></div>
        </div>
        <div class="panel view">
          <div class="view-head">
            <div class="panel-title" data-t="fromEarth"></div>
            <div class="goal">
              <div class="goal-text">
                <b id="ask"></b>
                <small id="feedback"></small>
              </div>
              <svg id="goalPic" class="goal-pic" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
            </div>
          </div>
          <svg id="view" viewBox="-120 -120 240 240"></svg>
          <div class="phase-name" id="phaseName"></div>
          <div class="phase-info" id="phaseInfo"></div>
          <div id="fact" class="fact hidden">
            <div class="fact-body">
              <figure id="factPic" class="hidden">
                <img src="../pusle/images/eclipse.jpg" alt="">
                <a href="https://www.astrobin.com/ytu8fs/" target="_blank" rel="noopener" data-t="eclipseCredit"></a>
              </figure>
              <p id="factText"></p>
            </div>
            <button id="nextBtn" class="btn">▶ <span data-t="next"></span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Win: a card that pops up over the game -->
  <div id="win" class="overlay hidden">
    <canvas id="confetti"></canvas>
    <div class="win-card">
      <div class="win-moon"><img src="../pusle/images/moon.jpg" alt=""></div>
      <h2><span data-t="wellDone"></span> 🎉</h2>
      <p class="win-name" data-t="allSolved"></p>
      <a class="win-credit" href="https://www.astrobin.com/oy5di6/" target="_blank" rel="noopener" data-t="moonCredit"></a>
      <div class="win-buttons">
        <button id="againBtn" class="btn">🔁 <span data-t="again"></span></button>
        <a class="btn alt" href="../index.html">🏠 <span data-t="allGames"></span></a>
      </div>
    </div>
  </div>

  <script src="../shared/common.js"></script>
  <script src="app.js"></script>
</body>
</html>
