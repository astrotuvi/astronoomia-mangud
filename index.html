<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- the pages are dark already: keeps phone browsers from recolouring them in dark mode -->
  <meta name="color-scheme" content="dark">
  <title>Astronoomia mängud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/common.css">
  <style>
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }
    .game-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 12px 16px;
      border-radius: 26px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, background 0.15s;
    }
    .game-card:hover { background: var(--card-hover); transform: scale(1.03); }
    .game-card img, .game-card svg {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      background: #0b1238;
    }
    .game-card b { font-size: 1.6rem; color: var(--accent); padding: 0 6px; }
    .game-card span { font-size: 1.05rem; font-weight: 600; color: var(--muted); padding: 0 6px; }
    /* Mälumäng: a found pair and two cards face down */
    .memo {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 18px;
      background: #0b1238;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10%;
      padding: 12%;
    }
    .memo i, .memo img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14%;
      display: block;
      object-fit: cover;
    }
    .memo img { border: 3px solid var(--accent); box-shadow: 0 0 14px rgba(255, 211, 77, 0.6); }
    .memo i {
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 2.2rem;
      color: var(--accent);
      background: radial-gradient(circle at 50% 40%, #3550b8, #1a2366 70%);
      border: 3px solid rgba(255, 211, 77, 0.75);
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <main class="screen menu">
    <div class="menu-inner">
      <header class="menu-head">
        <h1><span class="logo">🔭</span> <span data-t="title"></span></h1>
        <div class="lang">
          <button data-lang="et">EST</button>
          <button data-lang="en">ENG</button>
        </div>
      </header>

      <div class="games">
        <a class="game-card" href="pusle/index.html">

              <circle cx="68" cy="61" r="2.6" /><circle cx="58" cy="51" r="2.1" />
              <circle cx="40" cy="53" r="2.9" /><circle cx="26" cy="54" r="2.7" />
              <circle cx="10" cy="69" r="2.8" />
              <circle cx="20" cy="18" r="0.6" opacity="0.6" /><circle cx="70" cy="82" r="0.7" opacity="0.5" />
              <circle cx="40" cy="80" r="0.5" opacity="0.6" /><circle cx="90" cy="88" r="0.6" opacity="0.5" />

          <span data-t="memoryText"></span>

        <a class="game-card" href="kuufaasid/index.html">

              <clipPath id="moonDisc"><circle cx="50" cy="50" r="36" /></clipPath>

      </div>

      <footer class="credit" data-t="credit"></footer>
    </div>
  </main>
