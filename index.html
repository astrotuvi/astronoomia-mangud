  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- the pages are dark already: keeps phone browsers from recolouring them in dark mode -->

  <title>Astronoomia mängud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/common.css">
  <style>
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }
    .game-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 12px 16px;
      border-radius: 26px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, background 0.15s;
    }
    .game-card:hover { background: var(--card-hover); transform: scale(1.03); }
    .game-card img, .game-card svg {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      background: #0b1238;
    }
    .game-card b { font-size: 1.6rem; color: var(--accent); padding: 0 6px; }
    .game-card span { font-size: 1.05rem; font-weight: 600; color: var(--muted); padding: 0 6px; }
    /* Mälumäng: a found pair and two cards face down */
    .memo {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 18px;
      background: #0b1238;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10%;
      padding: 12%;
    }
    .memo i, .memo span {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14%;
      display: block;
    }
    .memo span { overflow: hidden; border: 3px solid var(--accent); box-shadow: 0 0 14px rgba(255, 211, 77, 0.6); }
    /* drawn twice as big and scaled down: phones in dark mode turn small dark pictures white */
    .memo img {
      display: block;
      width: 200%;
      height: 200%;
      object-fit: cover;
      transform: scale(0.5);
      transform-origin: 0 0;
    }
    .memo i {
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 2.2rem;
      color: var(--accent);
      background: radial-gradient(circle at 50% 40%, #3550b8, #1a2366 70%);
      border: 3px solid rgba(255, 211, 77, 0.75);
    }
    /* the QR code and address of the published games */
    .share {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 30px;
    }
    .share img {
      width: 132px;
      height: 132px;
      border-radius: 12px;
      display: block;
    }
    .share a { color: var(--muted); font-weight: 800; text-decoration: none; }
    .share a:hover { text-decoration: underline; }
  </style>
</head>
