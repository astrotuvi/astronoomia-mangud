<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- the pages are dark already: keeps phone browsers from recolouring them in dark mode -->
  <meta name="color-scheme" content="dark">
  <title>Püüa langev täht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <!-- the glow of the jar and its stars (kept out of display:none parts) -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="jarGlow" cx="0.5" cy="0.6" r="0.5">
        <stop offset="0" stop-color="#ffe680" stop-opacity="0.8" />
        <stop offset="1" stop-color="#ffd34d" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#bfe6ff" stop-opacity="0.22" />
        <stop offset="0.5" stop-color="#bfe6ff" stop-opacity="0.08" />
        <stop offset="1" stop-color="#bfe6ff" stop-opacity="0.2" />
      </linearGradient>
      <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.6" result="blur" />
        <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
  </svg>

  <!-- Menu -->
  <main id="menu" class="screen menu">
    <div class="menu-inner">
      <header class="menu-head">
        <a class="icon" href="../index.html" data-t-label="allGames" aria-label="Kõik mängud">🏠</a>
        <h1><span class="logo">🌠</span> <span data-t="title"></span></h1>
        <div class="lang">
          <button data-lang="et">EST</button>
          <button data-lang="en">ENG</button>
        </div>
      </header>

      <p class="intro" data-t="intro"></p>
      <h2><span class="step">1</span> <span data-t="night"></span></h2>
      <!-- the nights to pick, in the order of NIGHTS in app.js; the pictures
           are flat shapes, which phones in dark mode leave as they are -->
      <div id="nights" class="pictures nights">

            <g fill="#fff"><circle cx="98.1" cy="17.5" r="0.9" /><circle cx="92.5" cy="52.1" r="0.9" /><circle cx="45.1" cy="43.7" r="0.9" /></g>
            <circle cx="43" cy="16.7" r="1.2" fill="#fff" />

            <circle cx="27.5" cy="19.6" r="1.2" fill="#fff" />

            <circle cx="72.3" cy="47.2" r="0.6" fill="#fff" />
            <circle cx="72.4" cy="54" r="1.3" fill="#fff" />
            <circle cx="73.2" cy="57.7" r="0.7" fill="#fff" />
            <path d="M0 84L4 75L8 84L12 71L16 84L21 74L25 84L30 72L34 84L38 77L42 84L46 70L50 84L54 76L58 84L64 84V100H0Z" fill="#03050f" />
            <path d="M64 84V77H86V84Z" fill="#03050f" />
            <path d="M62 77.5L75 69L88 77.5Z" fill="#03050f" />
            <path d="M67 79H71V82H67ZM79 79H83V82H79Z" fill="#ffcf6b" />
            <path d="M86 84L90 74L94 84L97 76L100 84V100H64V84Z" fill="#03050f" />
          </svg>
          <span><b data-t="augNight"></b><small data-t="perseids"></small></span>
        </button>
        <button class="pic" data-night="geminids">
          <!-- December, facing south: the Twins, Orion, snow and the Geminids, the
               figures as seen from Tõrva at 01:00 -->
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect width="100" height="100" fill="#0b1440" />
            <g fill="#fff"><circle cx="6" cy="8" r="0.45" opacity="0.5" /><circle cx="40" cy="4" r="0.45" opacity="0.5" /><circle cx="92" cy="8" r="0.45" opacity="0.5" /><circle cx="86" cy="36" r="0.45" opacity="0.5" /><circle cx="6" cy="46" r="0.45" opacity="0.5" /><circle cx="52" cy="66" r="0.45" opacity="0.5" /><circle cx="94" cy="62" r="0.45" opacity="0.5" /><circle cx="24" cy="62" r="0.45" opacity="0.5" /><circle cx="70" cy="20" r="0.45" opacity="0.5" /><circle cx="16" cy="30" r="0.45" opacity="0.5" /></g>

            <circle cx="75.1" cy="33.4" r="1.5" fill="#fff" />
            <circle cx="71.4" cy="46.9" r="1.2" fill="#fff" />
            <circle cx="69.3" cy="48.7" r="1.5" fill="#fff" />
            <circle cx="67" cy="50.2" r="1.4" fill="#fff" />
            <circle cx="63.2" cy="66" r="1.3" fill="#fff" />
            <circle cx="80.1" cy="63.2" r="2.2" fill="#cfe2ff" />
            <circle cx="15.9" cy="21" r="1.5" fill="#fff" />
            <circle cx="24" cy="21.2" r="0.6" fill="#fff" />
            <circle cx="35.1" cy="25.4" r="0.9" fill="#fff" />
            <circle cx="43.3" cy="26.4" r="0.9" fill="#fff" />
            <circle cx="46" cy="25.3" r="0.8" fill="#fff" />
            <circle cx="20.5" cy="26.2" r="0.6" fill="#fff" />
            <circle cx="17.5" cy="28.4" r="0.6" fill="#fff" />
            <circle cx="14" cy="27.6" r="1.7" fill="#ffe2b0" />
            <circle cx="24.8" cy="34" r="0.7" fill="#fff" />
            <circle cx="30.8" cy="34.3" r="0.6" fill="#fff" />
            <circle cx="41.9" cy="37" r="1.4" fill="#fff" />
            <circle cx="28" cy="41.6" r="0.6" fill="#fff" />
            <circle cx="41.2" cy="43" r="0.7" fill="#fff" />
            <path d="M0 84L4 75L8 84L12 71L16 84L21 74L25 84L30 72L34 84L38 77L42 84L46 70L50 84L54 76L58 84L64 84V100H0Z" fill="#03050f" />
            <path d="M64 84V77H86V84Z" fill="#03050f" />
            <path d="M62 77.5L75 69L88 77.5Z" fill="#03050f" />
            <path d="M67 79H71V82H67ZM79 79H83V82H79Z" fill="#ffcf6b" />
            <path d="M86 84L90 74L94 84L97 76L100 84V100H64V84Z" fill="#03050f" />
            <path d="M61.5 77.5L75 69L88.5 77.5L86 77.5L75 71L64 77.5Z" fill="#e6eeff" />
            <path d="M0 88C20 85 40 86 60 88S90 86 100 87V100H0Z" fill="#dce6fa" />
          </svg>
          <span><b data-t="decNight"></b><small data-t="geminids"></small></span>
        </button>
      </div>
      <h2><span class="step">2</span> <span data-t="level"></span></h2>
      <div id="levels" class="counts levels"></div>
      <p id="stormTip" class="storm-tip hidden"></p>
      <div class="menu-jar"><svg id="menuJar" viewBox="0 0 100 120" aria-hidden="true"></svg></div>
      <p id="best" class="best"></p>
      <div class="clear-row"><button id="clearBtn" class="clear-best hidden"></button></div>
      <p id="shower" class="shower hidden"></p>

      <div class="play-row">
        <button id="playBtn" class="play">▶ <span data-t="play"></span></button>
      </div>
    </div>
  </main>

  <!-- Game -->
  <div id="game" class="screen game hidden">
    <div class="bar">
      <button id="homeBtn" class="icon" data-t-label="menu" aria-label="Menüü">⬅️</button>
      <div class="progress">
        <div id="clock" class="clock"></div>
        <div class="track"><div id="progressFill" class="fill"></div></div>
        <div id="progressText" class="progress-text"></div>
      </div>
      <button id="soundBtn" class="icon toggle" data-t-label="sound" aria-label="Heli">🔊</button>
    </div>
    <div id="area" class="area">
      <canvas id="night"></canvas>
      <svg id="jar" class="jar" viewBox="0 0 100 120" aria-hidden="true"></svg>
      <div id="tap" class="tap hidden">👆</div>
      <div id="caption" class="caption hidden"><b id="capTitle"></b><small id="capText"></small></div>
    </div>
  </div>

  <!-- Win overlay -->
  <div id="win" class="overlay hidden">
    <canvas id="confetti"></canvas>
    <div class="win-pic"><svg id="winJar" viewBox="0 0 100 120" aria-hidden="true"></svg></div>
    <div class="win-card">
      <h2><span data-t="nightOver"></span> 🌅</h2>
      <p id="winCount" class="win-name"></p>
      <p id="winBest" class="win-best"></p>
      <p id="winTip" class="win-fact"></p>
      <div class="win-buttons">
        <button id="againBtn" class="btn">🔁 <span data-t="again"></span></button>
        <button id="menuBtn" class="btn alt">⬅️ <span data-t="menu"></span></button>
      </div>
    </div>
  </div>

  <script src="../shared/common.js"></script>
  <script src="app.js"></script>
</body>
</html>
