<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- the pages are dark already: keeps phone browsers from recolouring them in dark mode -->
  <meta name="color-scheme" content="dark">
  <title>Püüa langev täht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <!-- the glow of the jar and its stars (kept out of display:none parts) -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="jarGlow" cx="0.5" cy="0.6" r="0.5">
        <stop offset="0" stop-color="#ffe680" stop-opacity="0.8" />
        <stop offset="1" stop-color="#ffd34d" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#bfe6ff" stop-opacity="0.22" />
        <stop offset="0.5" stop-color="#bfe6ff" stop-opacity="0.08" />
        <stop offset="1" stop-color="#bfe6ff" stop-opacity="0.2" />
      </linearGradient>
      <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.6" result="blur" />
        <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
  </svg>

  <!-- Menu -->
  <main id="menu" class="screen menu">
    <div class="menu-inner">
      <header class="menu-head">
        <a class="icon" href="../index.html" data-t-label="allGames" aria-label="Kõik mängud">🏠</a>
        <h1><span class="logo">🌠</span> <span data-t="title"></span></h1>
        <div class="lang">
          <button data-lang="et">EST</button>
          <button data-lang="en">ENG</button>
        </div>
      </header>

      <p class="intro" data-t="intro"></p>
      <div class="menu-jar"><svg id="menuJar" viewBox="0 0 100 120" aria-hidden="true"></svg></div>
      <p id="best" class="best"></p>
      <p id="shower" class="shower hidden"></p>

      <div class="play-row">
        <button id="playBtn" class="play">▶ <span data-t="play"></span></button>
      </div>
    </div>
  </main>

  <!-- Game -->
  <div id="game" class="screen game hidden">
    <div class="bar">
      <button id="homeBtn" class="icon" data-t-label="menu" aria-label="Menüü">⬅️</button>
      <div class="progress">
        <div id="clock" class="clock"></div>
        <div class="track"><div id="progressFill" class="fill"></div></div>
        <div id="progressText" class="progress-text"></div>
      </div>
      <button id="soundBtn" class="icon toggle" data-t-label="sound" aria-label="Heli">🔊</button>
    </div>
    <div id="area" class="area">
      <canvas id="night"></canvas>
      <svg id="jar" class="jar" viewBox="0 0 100 120" aria-hidden="true"></svg>
      <div id="tap" class="tap hidden">👆</div>
      <div id="caption" class="caption hidden"><b id="capTitle"></b><small id="capText"></small></div>
    </div>
  </div>

  <!-- Win overlay -->
  <div id="win" class="overlay hidden">
    <canvas id="confetti"></canvas>
    <div class="win-pic"><svg id="winJar" viewBox="0 0 100 120" aria-hidden="true"></svg></div>
    <div class="win-card">
      <h2><span data-t="nightOver"></span> 🌅</h2>
      <p id="winCount" class="win-name"></p>
      <p id="winBest" class="win-best"></p>
      <p class="win-fact" data-t="winTip"></p>
      <div class="win-buttons">
        <button id="againBtn" class="btn">🔁 <span data-t="again"></span></button>
        <button id="menuBtn" class="btn alt">⬅️ <span data-t="menu"></span></button>
      </div>
    </div>
  </div>

  <script src="../shared/common.js"></script>
  <script src="app.js"></script>
</body>
</html>
