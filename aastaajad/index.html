<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- the pages are dark already: keeps phone browsers from recolouring them in dark mode -->
  <meta name="color-scheme" content="dark">
  <title>Kuidas tekivad aastaajad?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <!-- Menu: pick a task; each opens when the one before it is solved -->
  <main id="menu" class="screen menu">
    <div class="menu-inner">
      <header class="menu-head">
        <a class="icon" href="../index.html" data-t-label="allGames" aria-label="Kõik mängud">🏠</a>
        <h1><span class="logo">🌍</span> <span data-t="title"></span></h1>
        <div class="lang">
          <button data-lang="et">EST</button>
          <button data-lang="en">ENG</button>
        </div>
      </header>

      <p class="intro" data-t="intro1"></p>
      <p class="intro" data-t="intro2"></p>

      <h2 data-t="chooseTask"></h2>
      <div id="levels" class="levels"></div>

      <div class="play-row">
        <button id="playBtn" class="play">▶ <span data-t="play"></span></button>
      </div>
      <div class="reset-row">
        <button id="resetBtn" class="reset hidden" data-t="reset"></button>
      </div>

      <footer class="credit">
        <div data-t="author"></div>
      </footer>
    </div>
  </main>

  <!-- Game: the task, the Earth going round the Sun, and the yard in Estonia -->
  <div id="game" class="screen game hidden">
    <div class="bar">
      <button id="homeBtn" class="icon" data-t-label="menu" aria-label="Menüü">⬅️</button>
      <div class="progress">
        <div class="track"><div id="progressFill" class="fill"></div></div>
        <div id="progressText" class="progress-text"></div>
      </div>
      <button id="hintBtn" class="icon" data-t-label="hint" aria-label="Vihje">💡</button>
      <button id="soundBtn" class="icon toggle" data-t-label="sound" aria-label="Heli">🔊</button>
    </div>
    <div id="area" class="area">
      <div class="task">
        <div class="task-text">
          <b id="taskTitle"></b>
          <small id="taskTip"></small>
        </div>
        <div id="options" class="options"></div>
        <label id="tiltBox" class="tilt hidden">
          <span id="tiltText"></span>
          <input id="tilt" type="range" min="0" max="40" step="1" value="23">
        </label>
      </div>
      <div class="panels">
        <div class="panel space">
          <canvas id="orbit"></canvas>
          <button id="cupBtn" class="cup hidden" aria-label="Lõpeta">🏆</button>
        </div>
        <div id="yards" class="panel yards"></div>
      </div>
    </div>
  </div>

  <!-- What was learnt, after a task is solved -->
  <div id="fact" class="fact hidden">
    <div class="fact-card">
      <p id="factText"></p>
      <div class="fact-buttons">
        <button id="nextBtn" class="btn"></button>
        <button id="factMenuBtn" class="btn alt">⬅️ <span data-t="menu"></span></button>
      </div>
    </div>
  </div>

  <!-- Win overlay: the Earth's path with the four seasons -->
  <div id="win" class="overlay hidden">
    <canvas id="confetti"></canvas>
    <div class="win-pic"><canvas id="winPic"></canvas></div>
    <div class="win-card">
      <h2><span data-t="winTitle"></span> 🎉</h2>
      <p class="win-name" data-t="winName"></p>
      <p class="win-fact" data-t="winFact"></p>
      <div class="win-buttons">
        <button id="againBtn" class="btn">🔁 <span data-t="again"></span></button>
        <button id="menuBtn" class="btn alt">⬅️ <span data-t="menu"></span></button>
      </div>
    </div>
  </div>

  <script src="../shared/common.js"></script>
  <script src="../shared/planets.js"></script>
  <script src="app.js"></script>
</body>
</html>
